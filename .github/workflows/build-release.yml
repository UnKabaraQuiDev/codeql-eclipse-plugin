name: Build and Publish Eclipse Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch, or commit to build (empty = current branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: eclipse-pages-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Eclipse plugin
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Prepare update site
        shell: bash
        run: |
          set -euo pipefail

          REPO_DIR="lu.kbra.codeql.repository/target/repository"

          if [ ! -d "$REPO_DIR" ]; then
            echo "::error::p2 repository not found: $REPO_DIR"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/p2-site"
          cp -a "$REPO_DIR/." "$RUNNER_TEMP/p2-site/"

          # Prevent GitHub Pages from using Jekyll processing.
          touch "$RUNNER_TEMP/p2-site/.nojekyll"

          # Ensure required p2 metadata exists.
          if ! find "$RUNNER_TEMP/p2-site" -maxdepth 1 \
            \( -name 'content.jar' -o -name 'content.xml' -o -name 'content.xml.xz' \) \
            | grep -q .; then
            echo "::error::Missing p2 content metadata"
            exit 1
          fi

          if ! find "$RUNNER_TEMP/p2-site" -maxdepth 1 \
            \( -name 'artifacts.jar' -o -name 'artifacts.xml' -o -name 'artifacts.xml.xz' \) \
            | grep -q .; then
            echo "::error::Missing p2 artifact metadata"
            exit 1
          fi

      - name: Package update site ZIP
        shell: bash
        run: |
          cd "$RUNNER_TEMP/p2-site"
          zip -qr "$RUNNER_TEMP/codeql-eclipse-update-site.zip" .

      - name: Upload update site artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-eclipse-update-site
          path: ${{ runner.temp }}/codeql-eclipse-update-site.zip
          retention-days: 30

      - name: Publish to pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Work in a separate Git worktree so the build checkout
          # remains untouched.
          PAGES_DIR="$RUNNER_TEMP/pages-worktree"

          if git ls-remote --exit-code --heads origin pages \
            >/dev/null 2>&1; then

            echo "Existing pages branch found."

            git fetch origin pages
            git worktree add -B pages "$PAGES_DIR" origin/pages

          else

            echo "Creating orphan pages branch."

            mkdir -p "$PAGES_DIR"
            git -C "$PAGES_DIR" init
            git -C "$PAGES_DIR" checkout --orphan pages
            git -C "$PAGES_DIR" remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          fi

          # Replace published site with the new p2 repository.
          # Preserve .git but remove all other content.
          find "$PAGES_DIR" -mindepth 1 -maxdepth 1 \
            ! -name .git -exec rm -rf -- {} +

          cp -a "$RUNNER_TEMP/p2-site/." "$PAGES_DIR/"

          git -C "$PAGES_DIR" add -A

          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git -C "$PAGES_DIR" commit -m \
            "Publish CodeQL Eclipse plugin from ${GITHUB_SHA}"

          git -C "$PAGES_DIR" push origin HEAD:pages
